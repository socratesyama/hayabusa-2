<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>RYUGU 38cm/s</title>
<meta name="description" content="リュウグウの表面を歩き、跳び、時間を動かす。JAXA/ISAS非公式ファンサイト。">
<meta name="theme-color" content="#0B0B10">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Fira+Code:wght@300;400;500&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./src/style.css">
</head>
<body>
<canvas id="gl" aria-label="リュウグウ表面の3D表示"></canvas>
<div id="hud" aria-live="off"><div id="h1"></div><div id="h2"></div><div id="h3"></div><div id="h4"></div></div>
<div id="live" class="sr" aria-live="polite"></div>
<div id="hint"></div>
<div id="card" class="overlay"></div>
<div id="viewer" class="overlay"></div>
<div id="intro"></div>
<div id="icons">
  <button id="b-ev" aria-label="イベント (V)" title="イベント (V)"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 9h18M8 3v4M16 3v4"/><circle cx="12" cy="15" r="1.6"/></svg></button>
  <button id="b-map" type="button" aria-pressed="true" aria-label="地名ガイド 表示切替 (N)" title="地名ガイド 表示切替 (N)"><svg viewBox="0 0 24 24"><path d="M12 21s-6-5.6-6-10a6 6 0 0 1 12 0c0 4.4-6 10-6 10z"/><circle cx="12" cy="11" r="2.2"/></svg></button>
  <button id="b-places" type="button" aria-label="地名・出来事リスト (L)" title="地名・出来事リスト (L)"><svg viewBox="0 0 24 24"><path d="M8 6h12M8 12h12M8 18h12"/><path d="M4 6h.01M4 12h.01M4 18h.01"/></svg></button>
  <button id="b-sound" aria-label="音 (S)" title="音 (S)"><svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16 9a4 4 0 0 1 0 6"/></svg></button>
  <button id="b-rec" aria-label="記録 (R)" title="記録 (R)"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="6"/></svg></button>
  <button id="b-lib" aria-label="データ書庫 (G)" title="データ書庫 (G)"><svg viewBox="0 0 24 24"><path d="M4 4h6v16H4zM14 4h6v16h-6z"/><path d="M7 8h.01M17 8h.01"/></svg></button>
</div>
<button id="spacebtn" type="button" aria-label="ジャンプして宇宙へ" style="display:none"></button>
<div id="stick" role="group" aria-label="移動用バーチャルスティック"><div id="knob"></div></div>
<footer id="foot">本サイトはJAXA/ISAS非公式のファンサイトです。データはDARTS等の公開アーカイブに基づく　<a href="./experts.html">専門家の皆さんへ</a></footer>
<script type="module" src="./src/main.ts"></script>
</body>
</html>
