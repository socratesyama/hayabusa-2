function makeStars() {
  const count = 1800;
  const positions = new Float32Array(count * 3);
  const colors = new Float32Array(count * 3);
  for (let i = 0; i < count; i++) {
    const a = Math.sin(i * 127.1) * 43758.5453;
    const b = Math.sin(i * 269.5 + 9.2) * 12741.713;
    const c = Math.sin(i * 53.7 + 2.7) * 31987.123;
    positions[i * 3] = ((a - Math.floor(a)) - .5) * 30;
    positions[i * 3 + 1] = ((b - Math.floor(b)) - .5) * 18;
    positions[i * 3 + 2] = ((c - Math.floor(c)) - .5) * 25 - 4;
    const tint = .48 + ((i * 17) % 50) / 100;
    colors[i * 3] = tint * .78;
    colors[i * 3 + 1] = tint * .88;
    colors[i * 3 + 2] = tint;
  }
  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute("position", new THREE.BufferAttribute(positions, 3));
  geometry.setAttribute("color", new THREE.BufferAttribute(colors, 3));
  const material = new THREE.PointsMaterial({ size: .018, vertexColors: true, transparent: true, opacity: .7, sizeAttenuation: true });
  starField = new THREE.Points(geometry, material);
  scene.add(starField);

function normalizeGeometry(geometry, maxRadius = 1.16) {
  geometry.computeBoundingBox();
  const box = geometry.boundingBox;
  const center = new THREE.Vector3();
  box.getCenter(center);
  geometry.translate(-center.x, -center.y, -center.z);
  geometry.computeBoundingSphere();
  const radius = geometry.boundingSphere?.radius || 1;
  const scale = maxRadius / radius;
  geometry.scale(scale, scale, scale);
  geometry.computeBoundingSphere();
  return { geometry, scale, center };
}

function loadPointCloud(kind) {
  const isLidar = kind === "lidar";
  const cached = isLidar ? lidarPoints : sfmPoints;
  if (cached) {
    cached.visible = true;
    if (activeGeometry && activeGeometry !== cached) activeGeometry.visible = false;
    replaceActiveObject(cached, isLidar ? "LIDAR / 396,649 RETURNS" : "SfM 3M / WEB 316K");
    return Promise.resolve(cached);
  }
  const token = ++currentLoadToken;
  const path = isLidar ? SOURCE.lidar : SOURCE.sfm;
  setLoading(isLidar ? "レーザー測距点を展開中" : "リュウグウへ接近中", isLidar ? "LIDAR measured returns / 396,649 points" : "SfM point cloud / 316k web points", 38);
  return new Promise((resolve, reject) => {
    const loader = new PLYLoader();
    loader.load(asset(path), (geometry) => {
      if (token !== currentLoadToken) { geometry.dispose(); return; }
      normalizeGeometry(geometry, 1.15);
      const hasColor = Boolean(geometry.getAttribute("color"));
      const material = new THREE.PointsMaterial({
        size: isLidar ? .010 : .0085,
        sizeAttenuation: true,
        vertexColors: hasColor,
        color: hasColor ? 0xffffff : (isLidar ? 0x91cde6 : 0xbec9bb),
        transparent: true,
        opacity: isLidar ? .92 : .97,
        depthWrite: true
      });
      const points = new THREE.Points(geometry, material);
      points.frustumCulled = true;
      if (isLidar) lidarPoints = points; else sfmPoints = points;
      setLoading("点群を配置しています", `${geometry.getAttribute("position").count.toLocaleString("en-US")} points ready`, 88);
      replaceActiveObject(points, isLidar ? "LIDAR / 396,649 RETURNS" : "SfM 3M / WEB 316K");
      hideLoading();
      resolve(points);
    }, (xhr) => {
      if (xhr.total) ui.loadingBar.style.width = `${Math.min(80, 38 + (xhr.loaded / xhr.total) * 42)}%`;
    }, (error) => {
      if (token !== currentLoadToken) return;
      reject(error);
    });
  });
}

function loadSpacecraft() {
  if (spacecraftModel) {
    if (activeGeometry && activeGeometry !== spacecraftModel) activeGeometry.visible = false;
    spacecraftModel.visible = true;
    replaceActiveObject(spacecraftModel, "HAYABUSA2 / 81 PARTS");
    camera.position.set(0, 1.5, 5.2);
    controls.target.set(0, 0, 0);
    controls.update();
    return Promise.resolve(spacecraftModel);
  }
  const token = ++currentLoadToken;
  setLoading("探査機モデルを展開中", "GLB / 81-part spacecraft model", 28);
  return new Promise((resolve, reject) => {
    new GLTFLoader().load(asset(SOURCE.spacecraft), (gltf) => {
      if (token !== currentLoadToken) return;
      const model = gltf.scene;
      const box = new THREE.Box3().setFromObject(model);
      const center = new THREE.Vector3();
      box.getCenter(center);
      model.position.sub(center);
      const size = new THREE.Vector3();
      box.getSize(size);
      const largest = Math.max(size.x, size.y, size.z) || 1;
      model.scale.setScalar(2.15 / largest);
      model.traverse((child) => {
        if (child.isMesh) { child.castShadow = true; child.receiveShadow = true; }
      });
      spacecraftModel = model;
      replaceActiveObject(model, "HAYABUSA2 / 81 PARTS");
      camera.position.set(0, 1.3, 5.1);
      controls.target.set(0, 0, 0);
      controls.update();
      hideLoading();
      resolve(model);
    }, (xhr) => {
      if (xhr.total) ui.loadingBar.style.width = `${Math.min(85, 28 + (xhr.loaded / xhr.total) * 57)}%`;
    }, reject);
  });
}

function clearMarker() {
  if (marker) {
    asteroidGroup.remove(marker);
    marker.traverse((child) => { child.geometry?.dispose?.(); child.material?.dispose?.(); });
    marker = null;
  }
}

function findSurfacePosition(lat, lon) {
  const displayedLayer = activeLayer === "tir" ? layerBeforeThermal : activeLayer;
  const source = (displayedLayer === "lidar" ? lidarPoints : sfmPoints)?.geometry?.getAttribute("position");
  const latRad = THREE.MathUtils.degToRad(lat);
  const lonRad = THREE.MathUtils.degToRad(lon);
  const direction = new THREE.Vector3(Math.cos(latRad) * Math.cos(lonRad), Math.sin(latRad), Math.cos(latRad) * Math.sin(lonRad)).normalize();
  if (!source) return direction.multiplyScalar(1.17);
  let bestDot = -Infinity;
  const best = new THREE.Vector3();
  const p = new THREE.Vector3();
  const stride = Math.max(1, Math.floor(source.count / 120000));
  for (let i = 0; i < source.count; i += stride) {
    p.fromBufferAttribute(source, i).normalize();
    const dot = p.dot(direction);
    if (dot > bestDot) { bestDot = dot; best.fromBufferAttribute(source, i); }
  }
  return best.multiplyScalar(1.035);
}

function updateMarker() {
  clearMarker();
  const displayedLayer = activeLayer === "tir" ? layerBeforeThermal : activeLayer;
  if (displayedLayer === "spacecraft" || !currentLocation || currentLocation.lat === null || currentLocation.lon === null) return;
  const position = findSurfacePosition(currentLocation.lat, currentLocation.lon);
  marker = new THREE.Group();
  marker.position.copy(position);
  const sphere = new THREE.Mesh(new THREE.SphereGeometry(.025, 16, 12), new THREE.MeshBasicMaterial({ color: 0xc7f36a }));
  const halo = new THREE.Sprite(new THREE.SpriteMaterial({ color: 0xc7f36a, transparent: true, opacity: .28, depthWrite: false }));
  halo.scale.set(.18, .18, 1);
  const stem = new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0, .02, 0), new THREE.Vector3(0, .13, 0)]), new THREE.LineBasicMaterial({ color: 0xc7f36a, transparent: true, opacity: .85 }));
  marker.add(halo, sphere, stem);
  asteroidGroup.add(marker);
}

async function activateLayer(layer) {
  const previousLayer = activeLayer;
  if (layer === "tir" && previousLayer !== "tir") layerBeforeThermal = previousLayer;
  activeLayer = layer;
  document.querySelectorAll(".layer-option").forEach((button) => {
    const selected = button.dataset.layer === layer;
    button.classList.toggle("is-selected", selected);
    button.setAttribute("aria-pressed", String(selected));
  });
  try {
    if (layer === "onc" || layer === "lidar") {
      if (activeGeometry) activeGeometry.visible = false;
      const loaded = await loadPointCloud(layer);
      loaded.visible = true;
      if (layer === "lidar") {
        ui.sceneModeLabel.textContent = "LIDAR / MEASURED RETURNS";
        ui.layerNote.textContent = "探査機搭載レーザー高度計のL2地形時系列を結合した実測点群。色は重心からの距離を表します。";
      } else {
        ui.sceneModeLabel.textContent = "ONC / SURFACE COLOUR";
        ui.layerNote.textContent = "ONC v-band全球ベースマップの色を付与したSfM形状点群を表示しています。";
      }
      updateMarker();
      updateUrl();
      return;
    }
    if (layer === "spacecraft") {
      if (activeGeometry) activeGeometry.visible = false;
      await loadSpacecraft();
      ui.sceneModeLabel.textContent = "HAYABUSA2 / SPACECRAFT";
      ui.layerNote.textContent = "公開資料をもとに構築された非公式の近似モデルです。JAXAの設計CADデータではありません。";
      clearMarker();
      updateUrl();
      return;
    }
    if (layer === "tir") {
      ui.sceneModeLabel.textContent = "TIR / STATIC THERMAL INERTIA";
      ui.layerNote.textContent = "熱慣性の静的全球マップを表示します。時系列温度レイヤーではありません。";
      ui.thermalModal.classList.add("is-open");
      ui.thermalModal.setAttribute("aria-hidden", "false");
      updateUrl();
      return;
    }
  } catch (error) {
    showError(`データの読み込みに失敗しました。${error?.message || ""} ネットワーク接続とファイルの公開状態を確認してください。`);
    console.error(error);
  }
}

function updateUrl() {
  const event = EVENTS[selectedEvent];
  const url = new URL(window.location.href);
  url.searchParams.set("time", event.iso);
  url.searchParams.set("instrument", activeLayer);
  if (currentLocation && currentLocation.lat !== null && currentLocation.lon !== null) {
    url.searchParams.set("lat", String(currentLocation.lat));
    url.searchParams.set("lon", String(currentLocation.lon));
  } else {
    url.searchParams.delete("lat");
    url.searchParams.delete("lon");
  }
  window.history.replaceState({}, "", url);
}

function renderEvent(index, { updateHistory = true } = {}) {
  selectedEvent = Math.max(0, Math.min(EVENTS.length - 1, index));
  const event = EVENTS[selectedEvent];
  ui.timeline.querySelectorAll(".time-stop").forEach((button) => {
    const active = button.dataset.event === event.id;
    button.classList.toggle("is-active", active);
    button.setAttribute("aria-current", active ? "step" : "false");
  });
  ui.slider.value = String(selectedEvent);
  ui.progress.textContent = `${String(selectedEvent + 1).padStart(2, "0")} / 05`;
  ui.eventNumber.textContent = event.number;
  ui.eventDate.textContent = event.date;
  ui.eventType.textContent = event.type;
  ui.eventTitle.textContent = event.title;
  ui.eventDescription.textContent = event.description;
  currentLocation = event.lat === null ? null : { lat: event.lat, lon: event.lon, label: event.location, manual: false };
  renderCoordinateReadout();
  ui.bottomDate.textContent = event.dateShort;
  ui.bottomEvent.textContent = event.short;
  ui.imageDate.textContent = event.imageDate;
  if (event.image) {
    ui.eventImage.src = asset(event.image);
    ui.eventImage.alt = `${event.imageDate} はやぶさ2 ONC公式ギャラリー画像`;
    ui.eventImageLink.style.display = "block";
  } else {
    ui.eventImageLink.style.display = "none";
  }
  ui.eventImageLink.href = event.imageSource;
  ui.sourceImageLink.href = event.imageSource;
  if (activeLayer !== "spacecraft") updateMarker();
  if (updateHistory) updateUrl();
}

function renderCoordinateReadout() {
  const location = currentLocation;
  ui.coordinateTag.textContent = location ? (location.label || "MANUAL PICK") : EVENTS[selectedEvent].location;
  ui.latitude.textContent = location ? `${Math.abs(location.lat).toFixed(2)}° ${location.lat < 0 ? "S" : "N"}` : "—";
  ui.longitude.textContent = location ? `${location.lon.toFixed(3)}° E` : "—";
  ui.bottomCoords.textContent = location ? `${Math.abs(location.lat).toFixed(2)}° ${location.lat < 0 ? "S" : "N"} / ${location.lon.toFixed(3)}° E` : EVENTS[selectedEvent].location;
}

function pickSurface(event) {
  if (!activeGeometry || (activeLayer !== "onc" && activeLayer !== "lidar")) return;
  const bounds = ui.canvas.getBoundingClientRect();
  const pointer = new THREE.Vector2(
    ((event.clientX - bounds.left) / bounds.width) * 2 - 1,
    -((event.clientY - bounds.top) / bounds.height) * 2 + 1
  );
  raycaster.setFromCamera(pointer, camera);
  const hits = raycaster.intersectObject(activeGeometry, true);
  if (!hits.length) return;
  const point = hits[0].point.clone().normalize();
  const latitude = THREE.MathUtils.radToDeg(Math.asin(THREE.MathUtils.clamp(point.y, -1, 1)));
  const longitude = (THREE.MathUtils.radToDeg(Math.atan2(point.z, point.x)) + 360) % 360;
  currentLocation = { lat: latitude, lon: longitude, label: "MANUAL SURFACE PICK", manual: true };
  renderCoordinateReadout();
  updateMarker();
  updateUrl();
  showToast(`地点を取得 · ${latitude.toFixed(2)}° N / ${longitude.toFixed(2)}° E`);
}

function setAutoRotate(enabled) {
  autoRotate = enabled;
  if (controls) controls.autoRotate = enabled;
  const button = $("#autoRotateButton");
  button.setAttribute("aria-pressed", String(enabled));
  button.querySelector("span:last-child").style.background = enabled ? "var(--accent)" : "var(--faint)";
}

function openDrawer() {
  ui.logDrawer.classList.add("is-open");
  ui.logDrawer.setAttribute("aria-hidden", "false");
  $("#closeLogButton").focus();
}
function closeDrawer() {
  ui.logDrawer.classList.remove("is-open");
  ui.logDrawer.setAttribute("aria-hidden", "true");
  $("#fieldLogButton").focus();
}
function renderLog() {
  ui.logCount.textContent = String(discoveries.length).padStart(2, "0");
  if (!discoveries.length) {
    ui.logItems.innerHTML = '<div class="empty-log"><span>✳</span><strong>まだ記録はありません。</strong><small>気になる地点や出来事を FIELD LOG に追加してください。</small></div>';
    return;
  }
  ui.logItems.innerHTML = discoveries.map((entry, index) => `
    <article class="log-entry">
      <div class="log-entry-top"><span>ENTRY ${String(index + 1).padStart(2, "0")}</span><span>${escapeHtml(entry.date)}</span></div>
      <h3>${escapeHtml(entry.title)}</h3><p>${escapeHtml(entry.summary)}</p>
      <button type="button" data-remove-log="${entry.id}">REMOVE ENTRY −</button>
    </article>`).join("");
}
function escapeHtml(value) {
  return String(value).replace(/[&<>"']/g, (char) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[char]);
}
function addDiscovery() {
  const event = EVENTS[selectedEvent];
  const duplicate = discoveries.some((entry) => entry.eventId === event.id);
  if (duplicate) { showToast("この出来事はすでに FIELD LOG にあります。"); return; }
  const locationText = currentLocation ? `\n選択座標: ${currentLocation.lat.toFixed(3)}° N / ${currentLocation.lon.toFixed(3)}° E` : "";
  discoveries.push({ id: `${event.id}-${currentLocation?.manual ? currentLocation.lat.toFixed(2) : "event"}-${discoveries.length}`, eventId: event.id, date: event.date, title: event.title, summary: `${event.detail}${locationText}`, layer: activeLayer });
  renderLog();
  showToast("FIELD LOG に追加しました。");
}
function exportLog() {
  if (!discoveries.length) { showToast("先に FIELD LOG へ記録を追加してください。"); return; }
  const lines = ["RYUGU FIELD REPORT", "THE ASTEROID YOU CAN VISIT", "", ...discoveries.flatMap((entry, index) => [`${String(index + 1).padStart(2, "0")} / ${entry.date} / ${entry.title}`, entry.summary, `Layer: ${entry.layer.toUpperCase()}`, ""])];
  lines.push("Source: https://github.com/socratesyama/hayabusa-2", "Unofficial data experience. Not affiliated with JAXA.");
  const blob = new Blob([lines.join("\n")], { type: "text/plain;charset=utf-8" });
  const link = document.createElement("a");
  link.href = URL.createObjectURL(blob);
  link.download = "ryugu-field-report.txt";
  link.click();
  URL.revokeObjectURL(link.href);
  showToast("探査レポートを出力しました。");
}
async function shareExpedition() {
  updateUrl();
  const url = window.location.href;
  try {
    if (navigator.share) await navigator.share({ title: "RYUGU — THE ASTEROID YOU CAN VISIT", text: `${EVENTS[selectedEvent].title} / ${activeLayer.toUpperCase()}`, url });
    else if (navigator.clipboard?.writeText) { await navigator.clipboard.writeText(url); showToast("現在の探査状態を含むURLをコピーしました。"); }
    else { window.prompt("このURLをコピーしてください", url); }
  } catch (error) {
    if (error?.name !== "AbortError") showToast("共有を開始できませんでした。");
  }
}

function parseInitialState() {
  const params = new URLSearchParams(window.location.search);
  const time = params.get("time");
  if (time) {
    const match = EVENTS.findIndex((event) => time.startsWith(event.iso));
    if (match >= 0) selectedEvent = match;
  }
  const lat = Number(params.get("lat"));
  const lon = Number(params.get("lon"));
  if (params.has("lat") && params.has("lon") && Number.isFinite(lat) && Number.isFinite(lon) && Math.abs(lat) <= 90 && lon >= 0 && lon <= 360) {
    currentLocation = { lat, lon, label: "SHARED COORDINATE", manual: true };
  }
  const layer = params.get("instrument");
  if (["onc", "lidar", "tir", "spacecraft"].includes(layer)) activeLayer = layer;
}

function bindControls() {
  ui.timeline.addEventListener("click", (event) => {
    const button = event.target.closest("[data-event]");
    if (!button) return;
    const index = EVENTS.findIndex((item) => item.id === button.dataset.event);
    if (index >= 0) renderEvent(index);
  });
  ui.slider.addEventListener("input", () => renderEvent(Number(ui.slider.value)));
  ui.canvas.addEventListener("pointerdown", (event) => { pointerStart = { x: event.clientX, y: event.clientY, id: event.pointerId }; });
  ui.canvas.addEventListener("pointerup", (event) => {
    if (!pointerStart || pointerStart.id !== event.pointerId) return;
    const moved = Math.hypot(event.clientX - pointerStart.x, event.clientY - pointerStart.y);
    pointerStart = null;
    if (moved < 5) pickSurface(event);
  });
  ui.canvas.addEventListener("pointercancel", () => { pointerStart = null; });
  document.querySelectorAll(".layer-option").forEach((button) => button.addEventListener("click", () => activateLayer(button.dataset.layer)));
  $("#resetViewButton").addEventListener("click", () => {
    camera.position.set(0, 1.45, activeLayer === "spacecraft" ? 5.1 : 5.5);
    controls.target.set(0, 0, 0);
    controls.update();
    showToast("視点をリセットしました。");
  });
  $("#autoRotateButton").addEventListener("click", () => setAutoRotate(!autoRotate));
  $("#zoomInButton").addEventListener("click", () => { camera.position.multiplyScalar(.82); controls.update(); });
  $("#zoomOutButton").addEventListener("click", () => { camera.position.multiplyScalar(1.22); controls.update(); });
  $("#fullscreenButton").addEventListener("click", async () => {
    try { if (!document.fullscreenElement) await ui.mount.requestFullscreen(); else await document.exitFullscreen(); }
    catch { showToast("全画面表示はこの環境で利用できません。"); }
  });
  $("#recordButton").addEventListener("click", addDiscovery);
  $("#fieldLogButton").addEventListener("click", openDrawer);
  $("#closeLogButton").addEventListener("click", closeDrawer);
  $("#drawerBackdrop").addEventListener("click", closeDrawer);
  $("#shareButton").addEventListener("click", shareExpedition);
  $("#exportLogButton").addEventListener("click", exportLog);
  $("#clearLogButton").addEventListener("click", () => { discoveries = []; renderLog(); showToast("FIELD LOG を空にしました。"); });
  ui.logItems.addEventListener("click", (event) => {
    const button = event.target.closest("[data-remove-log]");
    if (!button) return;
    discoveries = discoveries.filter((entry) => entry.id !== button.dataset.removeLog);
    renderLog();
  });
  $("#closeThermalButton").addEventListener("click", closeThermal);
  $("#thermalBackdrop").addEventListener("click", closeThermal);
  $("#retryButton").addEventListener("click", () => activateLayer(activeLayer === "lidar" ? "lidar" : activeLayer === "spacecraft" ? "spacecraft" : "onc"));
  document.addEventListener("keydown", (event) => {
    if (event.key === "Escape") { closeDrawer(); closeThermal(); }
    if (event.key === "ArrowLeft" && !["INPUT", "TEXTAREA"].includes(document.activeElement.tagName)) renderEvent(selectedEvent - 1);
    if (event.key === "ArrowRight" && !["INPUT", "TEXTAREA"].includes(document.activeElement.tagName)) renderEvent(selectedEvent + 1);
  });
}
function closeThermal() {
  ui.thermalModal.classList.remove("is-open");
  ui.thermalModal.setAttribute("aria-hidden", "true");
  if (activeLayer === "tir") {
    activeLayer = layerBeforeThermal;
    document.querySelectorAll(".layer-option").forEach((button) => {
      const selected = button.dataset.layer === activeLayer;
      button.classList.toggle("is-selected", selected);
      button.setAttribute("aria-pressed", String(selected));
    });
    if (activeLayer === "lidar") {
      ui.sceneModeLabel.textContent = "LIDAR / MEASURED RETURNS";
      ui.layerNote.textContent = "探査機搭載レーザー高度計のL2地形時系列を結合した実測点群。色は重心からの距離を表します。";
    } else if (activeLayer === "spacecraft") {
      ui.sceneModeLabel.textContent = "HAYABUSA2 / SPACECRAFT";
      ui.layerNote.textContent = "公開資料をもとに構築された非公式の近似モデルです。JAXAの設計CADデータではありません。";
    } else {
      ui.sceneModeLabel.textContent = "ONC / SURFACE COLOUR";
      ui.layerNote.textContent = "ONC v-band全球ベースマップの色を付与したSfM形状点群を表示しています。";
    }
    updateMarker();
    updateUrl();
  }
}

async function preloadTimelineData() {
  // These source files are loaded as a cross-check and to keep the explorer connected
  // to the repository's machine-readable timeline and body-fixed surface coordinates.
  const [timelineResponse, pointsResponse] = await Promise.all([
    fetch(asset("06_timeline_text/timeline.json")),
    fetch(asset("06_timeline_text/ryugu_surface_points.json"))
  ]);
  if (!timelineResponse.ok || !pointsResponse.ok) throw new Error("timeline.json / ryugu_surface_points.json を取得できませんでした。");
  const [timeline, points] = await Promise.all([timelineResponse.json(), pointsResponse.json()]);
  window.RYUGU_ARCHIVE = { timeline, points };
}

async function boot() {
  parseInitialState();
  const sharedLocation = currentLocation;
  bindControls();
  renderEvent(selectedEvent, { updateHistory: false });
  if (sharedLocation) { currentLocation = sharedLocation; renderCoordinateReadout(); }
  renderLog();
  try {
    initScene();
    await preloadTimelineData();
    const requestedLayer = activeLayer;
    if (activeLayer === "tir") activeLayer = "onc"; // TIR is a static map preview, not a time-varying 3D layer.
    if (activeLayer === "spacecraft") {
      await loadSpacecraft();
      ui.sceneModeLabel.textContent = "HAYABUSA2 / SPACECRAFT";
      ui.layerNote.textContent = "公開資料をもとに構築された非公式の近似モデルです。JAXAの設計CADデータではありません。";
      document.querySelectorAll(".layer-option").forEach((button) => {
        const selected = button.dataset.layer === "spacecraft";
        button.classList.toggle("is-selected", selected);
        button.setAttribute("aria-pressed", String(selected));
      });
    } else {
      await loadPointCloud(activeLayer === "lidar" ? "lidar" : "onc");
      if (activeLayer === "lidar") {
        ui.sceneModeLabel.textContent = "LIDAR / MEASURED RETURNS";
        ui.layerNote.textContent = "探査機搭載レーザー高度計のL2地形時系列を結合した実測点群。色は重心からの距離を表します。";
        document.querySelectorAll(".layer-option").forEach((button) => {
          const selected = button.dataset.layer === "lidar";
          button.classList.toggle("is-selected", selected);
          button.setAttribute("aria-pressed", String(selected));
        });
      }
    }
    hideLoading();
    if (requestedLayer === "tir") {
      layerBeforeThermal = "onc";
      activeLayer = "tir";
      ui.sceneModeLabel.textContent = "TIR / STATIC THERMAL INERTIA";
      ui.layerNote.textContent = "熱慣性の静的全球マップを表示します。時系列温度レイヤーではありません。";
      document.querySelectorAll(".layer-option").forEach((button) => {
        const selected = button.dataset.layer === "tir";
        button.classList.toggle("is-selected", selected);
        button.setAttribute("aria-pressed", String(selected));
      });
      ui.thermalModal.classList.add("is-open");
      ui.thermalModal.setAttribute("aria-hidden", "false");
    }
    if (currentLocation) renderCoordinateReadout();
    updateMarker();
    updateUrl();
  } catch (error) {
    console.error(error);
    showError(`読み込みに失敗しました: ${error?.message || "不明なエラー"}。index.html を file:// で開かず、HTTPサーバー経由で開いてください。`);
  }
}

boot();

</script>

<body>
  <div class="noise" aria-hidden="true"></div>
  <div class="app-shell">
    <header class="topbar">
      <a class="brand" href="./" aria-label="RYUGU explorer home">
